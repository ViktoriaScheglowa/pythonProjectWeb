{% extends 'base.html' %}
{% load my_tags %}
{% block title %}Список продуктов{% endblock %}
{% block content %}
    <h2>Список категорий</h2>
    <div class="album py-5 bg-body-tertiary">
        <div class="container">
          <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            <select name="category">
                {% for category in categories %}
                   <div class="col">
                    <div class="card shadow-sm">
                      <div class="card-body">
                        <p class="card-text">{{ category.title }}</p>
                        <p class="card-text">Описание: {{category.description | truncatechars:100}}</p>
                        <div class="d-flex justify-content-between align-items-center">
                          <div class="btn-group">
                              <a class="btn btn-primary" href="{% url 'catalog:category_detail' category.pk %}" role="button">Подробности</a>
                          </div>
                          </div>
                      </div>
                    </div>
                  </div>
                {% endfor %}
            </select>
          </div>
        </div>
      </div>
{% endblock %}
